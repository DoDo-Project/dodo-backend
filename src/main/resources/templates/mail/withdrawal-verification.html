<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <title>DoDo 회원 탈퇴 인증번호</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #f4f4f5;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
  >
    <div
      style="display: none; max-height: 0; overflow: hidden; opacity: 0; mso-hide: all"
      th:text="'DoDo 회원 탈퇴 인증번호는 ' + ${code} + ' 입니다.'"
    >
      DoDo 회원 탈퇴 인증번호 안내
    </div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f4f5"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 600px;
              max-width: 600px;
              background-color: #ffffff;
              border: 1px solid #e5e5e5;
              border-radius: 16px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                align="center"
                style="
                  padding: 32px 40px 24px 40px;
                  border-bottom: 1px solid #f1f1f1;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto,
                    Helvetica, Arial, sans-serif;
                "
              >
                <!-- cid:logo는 GmailServiceImpl.addInline("logo", Logo.png, "image/png")에서 제공합니다. -->
                <img
                  src="Logo.png"
                  th:src="'cid:logo'"
                  alt="DoDo"
                  width="120"
                  style="display: block; width: 120px; height: auto; border: 0; outline: none; text-decoration: none"
                />
              </td>
            </tr>

            <tr>
              <td
                style="
                  padding: 32px 40px 8px 40px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto,
                    Helvetica, Arial, sans-serif;
                "
              >
                <h1 style="margin: 0 0 12px 0; font-size: 20px; font-weight: 700; color: #171717">
                  회원 탈퇴 인증번호
                </h1>
                <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #525252">
                  회원 탈퇴를 진행하기 위해 본인 확인이 필요합니다.<br />
                  아래 6자리 인증번호를 인증번호 입력란에 입력해 주세요.
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding: 24px 40px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="padding: 24px 16px; background-color: #fdf1e7; border-radius: 8px">
                      <div
                        style="
                          font-family:
                            Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic',
                            'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                          font-size: 36px;
                          font-weight: 800;
                          letter-spacing: 12px;
                          color: #e56c31;
                          padding-left: 12px;
                        "
                        th:text="${code}"
                      >
                        000000
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td
                style="
                  padding: 0 40px 8px 40px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto,
                    Helvetica, Arial, sans-serif;
                "
              >
                <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #737373">
                  인증번호는 발송 시점부터 <strong style="color: #525252">5분</strong> 동안만 유효합니다.
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding: 16px 40px 32px 40px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      style="
                        padding: 16px 20px;
                        background-color: #f9fafb;
                        border-radius: 12px;
                        font-family:
                          -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto,
                          Helvetica, Arial, sans-serif;
                      "
                    >
                      <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #737373">
                        본인이 요청하지 않은 메일이라면 계정 보안을 위해 이 메일을 무시하고 비밀번호 변경 등을
                        확인해 주세요. 인증번호는 다른 사람에게 공유하지 마세요.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td
                align="center"
                style="
                  padding: 24px 40px 32px 40px;
                  border-top: 1px solid #f1f1f1;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto,
                    Helvetica, Arial, sans-serif;
                "
              >
                <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #a3a3a3">
                  본 메일은 발신 전용이므로 이 메일로 회신하실 경우 답변을 받을 수 없습니다.<br />
                  &copy; DoDo. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
